name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}/demo-app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ github.ref_name }} ./backend

      - name: Push Docker Image
        run: docker push $IMAGE_NAME:${{ github.ref_name }}

      - name: Set Environment Directory
        id: set-env
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            echo "env_dir=dev" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "staging" ]]; then
            echo "env_dir=staging" >> $GITHUB_OUTPUT
          else
            echo "env_dir=prod" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Kubernetes
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
        run: |
          sed -i "s|ghcr.io/OWNER/REPO/demo-app:latest|$IMAGE_NAME:${{ github.ref_name }}|g" k8s/${{ steps.set-env.outputs.env_dir }}/deployment.yaml
          kubectl apply -f k8s/${{ steps.set-env.outputs.env_dir }}/deployment.yaml